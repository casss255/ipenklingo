<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ipenk Lingo</title>
<meta name="description" content="Belajar bahasa Inggris dan Mandarin dengan latihan singkat, suara, dan cek pengucapan.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161420" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ipenk Lingo">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --sunk: #F5F2FA;
  --line: #E7E2EF;
  --ink: #2B2540;
  --muted: #7B7392;
  --primary: #FF7A1A;
  --primary-d: #D95F00;
  --violet: #7A5CFA;
  --violet-d: #5B3FD6;
  --ok: #2FB37A;
  --ok-d: #23905F;
  --ok-bg: #E4F7EE;
  --bad: #F0475B;
  --bad-d: #C7303F;
  --bad-bg: #FDE8EB;
  --gold: #FFB21E;
  --gold-d: #E08F00;
  --lock: #E4E0EB;
  --lock-d: #CBC5D6;
  --font: 'Nunito', 'Varela Round', -apple-system, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161420; --surface: #201D2E; --sunk: #29253A; --line: #39344F;
    --ink: #F1EEF9; --muted: #A59DBD;
    --ok-bg: #173628; --bad-bg: #3B1C25;
    --lock: #322D45; --lock-d: #24203A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161420; --surface: #201D2E; --sunk: #29253A; --line: #39344F;
  --ink: #F1EEF9; --muted: #A59DBD;
  --ok-bg: #173628; --bad-bg: #3B1C25;
  --lock: #322D45; --lock-d: #24203A;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 700 17px/1.4 var(--font); -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top, 0px); overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }

/* ---------- 3D buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 54px; border-radius: 16px;
  font-weight: 900; font-size: 17px; letter-spacing: .02em;
  background: var(--primary); color: #fff; box-shadow: 0 5px 0 var(--primary-d);
  transform: translateY(0); transition: transform .06s, box-shadow .06s;
  margin-bottom: 5px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-d); }
.btn.violet { background: var(--violet); box-shadow: 0 5px 0 var(--violet-d); }
.btn.ok { background: var(--ok); box-shadow: 0 5px 0 var(--ok-d); }
.btn.bad { background: var(--bad); box-shadow: 0 5px 0 var(--bad-d); }
.btn.plain { background: var(--surface); color: var(--violet); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn:disabled { background: var(--lock); color: var(--muted); box-shadow: 0 5px 0 var(--lock-d); cursor: default; transform: none; }

/* ---------- Top bar ---------- */
#view { max-width: 600px; margin: 0 auto; padding: 0 16px calc(100px + env(safe-area-inset-bottom, 0px)); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 2px; border-bottom: 2px solid var(--line); margin: 0 -16px 0; padding-left: 16px; padding-right: 16px;
}
.stat-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 8px; border-radius: 12px; font-weight: 900; font-size: 17px; }
.stat-pill .e { font-size: 22px; line-height: 1; }
.stat-pill.flag { border: 2px solid var(--line); }
.streak-on { color: var(--primary); }
.streak-off { color: var(--muted); }
.heart { color: var(--bad); }
.xp { color: var(--gold-d); }

/* ---------- Path ---------- */
.unit {
  margin: 20px 0 8px; border-radius: 18px; padding: 16px 18px; color: #fff;
  background: var(--unit-c); box-shadow: 0 5px 0 var(--unit-d);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.unit small { display: block; font-weight: 800; opacity: .85; font-size: 15px; }
.unit h2 { font-size: 22px; font-weight: 900; }
.path { position: relative; display: flex; flex-direction: column; align-items: center; padding: 46px 0 8px; }
.node-wrap { position: relative; height: 104px; width: 100%; display: flex; justify-content: center; }
.node {
  position: relative; width: 74px; height: 70px; border-radius: 50%;
  background: var(--n); box-shadow: 0 7px 0 var(--nd);
  display: grid; place-items: center; color: #fff; font-size: 30px;
  transform: translateX(var(--x));
}
.node:active { transform: translateX(var(--x)) translateY(5px); box-shadow: 0 2px 0 var(--nd); }
.node svg { width: 34px; height: 34px; }
.node.locked { --n: var(--lock); --nd: var(--lock-d); color: var(--muted); cursor: default; }
.node.done { --n: var(--gold); --nd: var(--gold-d); }
.node.current { --n: var(--primary); --nd: var(--primary-d); }
.node.current::before {
  content: ''; position: absolute; inset: -11px; border-radius: 50%;
  border: 6px solid color-mix(in srgb, var(--primary) 25%, transparent);
}
.bubble {
  position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%);
  background: var(--surface); color: var(--primary); border: 2px solid var(--line);
  padding: 6px 14px; border-radius: 12px; font-weight: 900; white-space: nowrap; font-size: 15px;
  animation: bob 1.6s ease-in-out infinite;
}
.bubble::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top-color: var(--line); }
@keyframes bob { 50% { transform: translateX(-50%) translateY(-4px); } }
.node-label { position: absolute; top: 80px; left: 50%; transform: translateX(calc(-50% + var(--x))); font-size: 14px; color: var(--muted); font-weight: 800; white-space: nowrap; }
.mascot-side { position: absolute; width: 96px; top: 70px; }

/* ---------- Tabs ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; padding: 6px 16px; gap: 10px; }
.tabs button { min-height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; color: var(--muted); border: 2px solid transparent; }
.tabs button .e { font-size: 24px; }
.tabs button[aria-current="page"] { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 45%, transparent); background: color-mix(in srgb, var(--violet) 10%, transparent); }

/* ---------- Lesson ---------- */
body.in-lesson .tabs { display: none; }
body.in-lesson #view { padding-bottom: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.lesson-top { display: flex; align-items: center; gap: 14px; padding: 14px 0 6px; }
.x { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); flex: none; }
.x svg { width: 26px; height: 26px; }
.progress { flex: 1; height: 16px; border-radius: 9px; background: var(--lock); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 9px; background: var(--primary); transition: width .35s cubic-bezier(.3, .9, .3, 1.2); position: relative; }
.progress i::after { content: ''; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .35); }
.ex { flex: 1; padding: 16px 0 24px; }
.ex h2 { font-size: 24px; font-weight: 900; margin-bottom: 18px; }
.prompt-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px; }
.prompt-row .mascot { width: 78px; flex: none; }
.speech {
  position: relative; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px;
  font-size: 19px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.speech::before { content: ''; position: absolute; left: -10px; top: 22px; border: 9px solid transparent; border-right-color: var(--line); border-left: 0; }
.spk { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--violet); color: #fff; flex: none; box-shadow: 0 3px 0 var(--violet-d); }
.spk svg { width: 22px; height: 22px; }
.spk.big { width: 92px; height: 92px; border-radius: 24px; box-shadow: 0 6px 0 var(--violet-d); }
.spk.big svg { width: 44px; height: 44px; }
.spk.slow { background: var(--surface); color: var(--violet); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); width: 62px; height: 62px; font-size: 28px; }
.listen-row { display: flex; gap: 16px; align-items: flex-end; justify-content: center; margin: 8px 0 26px; }
.big-word { font-size: 40px; font-weight: 900; text-align: center; margin: 4px 0 2px; }
.pinyin { color: var(--muted); font-weight: 700; font-size: 16px; }
.center { text-align: center; }

.options { display: grid; gap: 12px; }
.opt {
  min-height: 58px; border-radius: 16px; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line);
  padding: 10px 16px; text-align: left; font-size: 18px; display: flex; align-items: center; gap: 12px; background: var(--surface);
}
.opt .k { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--violet); box-shadow: 0 4px 0 var(--violet); background: color-mix(in srgb, var(--violet) 10%, var(--surface)); color: var(--violet); }
.opt[aria-pressed="true"] .k { border-color: var(--violet); color: var(--violet); }

.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pairs .col { display: grid; gap: 12px; }
.pair { min-height: 62px; border-radius: 16px; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); background: var(--surface); padding: 6px 10px; font-size: 17px; line-height: 1.15; }
.pair small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
.pair[aria-pressed="true"] { border-color: var(--violet); box-shadow: 0 4px 0 var(--violet); color: var(--violet); }
.pair.matched { opacity: .35; border-color: var(--line); box-shadow: none; color: var(--muted); pointer-events: none; }
.pair.wrong { border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); color: var(--bad); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.answer-line { min-height: 124px; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); padding: 12px 0; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; margin-bottom: 26px;
  background-image: linear-gradient(var(--line), var(--line)); background-size: 100% 2px; background-position: 0 62px; background-repeat: no-repeat; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile { min-height: 48px; padding: 6px 14px; border-radius: 14px; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); background: var(--surface); font-size: 18px; line-height: 1.1; }
.tile small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.tile.used { background: var(--lock); color: transparent; border-color: var(--lock); box-shadow: none; pointer-events: none; }
.tile.used small { color: transparent; }

.mic-area { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 10px; }
.mic {
  width: 100%; min-height: 64px; border-radius: 18px; border: 2px solid var(--line); box-shadow: 0 5px 0 var(--line); background: var(--surface);
  display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--violet); font-weight: 900; font-size: 18px;
}
.mic svg { width: 28px; height: 28px; }
.mic.listening { background: var(--violet); color: #fff; border-color: var(--violet); box-shadow: 0 5px 0 var(--violet-d); }
.mic.listening svg { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.2); } }
.heard { width: 100%; border-radius: 16px; background: var(--sunk); padding: 12px 14px; font-size: 15px; color: var(--muted); }
.heard b { color: var(--ink); }
.say-target { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 22px; }
.say-target .w { display: inline-flex; flex-direction: column; align-items: center; border-radius: 8px; padding: 0 2px; }
.say-target .w small { font-size: 13px; color: var(--muted); font-weight: 700; }
.say-target .w.good { color: var(--ok); }
.say-target .w.miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 5px; }
.skip-link { color: var(--muted); font-weight: 900; font-size: 15px; min-height: 40px; letter-spacing: .02em; }
.note { font-size: 15px; color: var(--muted); font-weight: 700; text-align: center; }

/* ---------- Check bar ---------- */
.checkbar { position: sticky; bottom: 0; margin: 0 -16px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 2px solid var(--line); background: var(--bg); }
.checkbar.ok { background: var(--ok-bg); border-color: transparent; }
.checkbar.bad { background: var(--bad-bg); border-color: transparent; }
.fb { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.fb .badge { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
.fb .badge svg { width: 26px; height: 26px; }
.checkbar.ok .fb { color: var(--ok-d); }
.checkbar.bad .fb { color: var(--bad-d); }
:root[data-theme="dark"] .checkbar.ok .fb, :root[data-theme="dark"] .checkbar.bad .fb { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .checkbar.ok .fb, :root:not([data-theme="light"]) .checkbar.bad .fb { color: var(--ink); } }
.fb h3 { font-size: 22px; font-weight: 900; }
.fb p { font-size: 16px; margin-top: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ---------- Result ---------- */
.result { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 30px 0; }
.result .mascot { width: 170px; }
.result h1 { font-size: 30px; font-weight: 900; color: var(--gold-d); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 360px; }
.rc { border-radius: 16px; border: 2px solid var(--c); overflow: hidden; }
.rc small { display: block; background: var(--c); color: #fff; font-weight: 900; font-size: 13px; padding: 4px; }
.rc b { display: block; padding: 12px 6px; font-size: 22px; color: var(--c); }

/* ---------- Profile ---------- */
.profile h1 { font-size: 28px; font-weight: 900; margin: 18px 0 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 26px; }
.box { border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.box .e { font-size: 26px; }
.box b { display: block; font-size: 20px; font-weight: 900; line-height: 1.1; }
.box small { color: var(--muted); font-size: 13px; }
.sec-title { font-size: 20px; font-weight: 900; margin: 22px 0 10px; }
.choice { display: grid; gap: 10px; }
.choice button { min-height: 58px; border-radius: 16px; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left; }
.choice button .e { font-size: 26px; }
.choice button small { display: block; color: var(--muted); font-size: 13px; font-weight: 700; }
.choice button[aria-pressed="true"] { border-color: var(--violet); box-shadow: 0 4px 0 var(--violet); background: color-mix(in srgb, var(--violet) 9%, transparent); }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg3 button { min-height: 50px; border-radius: 14px; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); font-weight: 900; }
.seg3 button[aria-pressed="true"] { border-color: var(--violet); color: var(--violet); box-shadow: 0 4px 0 var(--violet); }
.goal { border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: flex; gap: 14px; align-items: center; }
.goal .bar { flex: 1; height: 14px; border-radius: 8px; background: var(--lock); overflow: hidden; }
.goal .bar i { display: block; height: 100%; background: var(--gold); border-radius: 8px; }
.danger-link { color: var(--bad); font-weight: 900; min-height: 48px; margin-top: 18px; }

.toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: calc(100% - 32px); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 800; font-size: 15px; text-align: center; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(15, 12, 25, .5); display: grid; place-items: center; padding: 20px; }
.modal .card { background: var(--bg); border-radius: 22px; padding: 22px; width: 100%; max-width: 380px; text-align: center; }
.modal .card .mascot { width: 110px; margin: 0 auto 8px; display: block; }
.modal h3 { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.modal p { color: var(--muted); margin-bottom: 18px; font-size: 16px; }

@media (prefers-reduced-motion: reduce) { .bubble, .mic.listening svg { animation: none; } .progress i { transition: none; } }

</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Menu utama" hidden></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* =========================================================
   Materi kursus. Kata: [target, arti, pinyin?]
   Kalimat EN: { t, id, alt? }   Kalimat ZH: { tk: [[hanzi, pinyin], ...], id, alt? }
   ========================================================= */
const COURSES = {

        { id: 'en2', title: 'Perkenalan',

          sentences: [
            { t: 'My name is Andi.', id: 'Nama saya Andi.' },
            { t: 'I am from Indonesia.', id: 'Saya dari Indonesia.', alt: ["I'm from Indonesia."] },
            { t: 'Where are you from?', id: 'Kamu dari mana?' },
            { t: 'I live in Bandung.', id: 'Saya tinggal di Bandung.' },
          ] },
        { id: 'en3', title: 'Angka & waktu',
          words: [['one', 'satu'], ['two', 'dua'], ['three', 'tiga'], ['ten', 'sepuluh'], ['today', 'hari ini'], ['tomorrow', 'besok']],
          sentences: [
            { t: 'I have two brothers.', id: 'Saya punya dua saudara laki-laki.' },
            { t: 'It is ten o\u2019clock.', id: 'Sekarang jam sepuluh.', alt: ["It's ten o'clock.", "It's ten.", 'It is ten.'] },
            { t: 'Today is Monday.', id: 'Hari ini hari Senin.' },
            { t: 'I will call you tomorrow.', id: 'Saya akan meneleponmu besok.', alt: ["I'll call you tomorrow."] },
          ] },
      ] },
      { title: 'Unit 2', desc: 'Sehari-hari', lessons: [
        { id: 'en4', title: 'Makan & minum',
          words: [['rice', 'nasi'], ['water', 'air'], ['coffee', 'kopi'], ['chicken', 'ayam'], ['eat', 'makan'], ['drink', 'minum']],
          sentences: [
            { t: 'I eat rice every day.', id: 'Saya makan nasi setiap hari.' },
            { t: 'She drinks coffee in the morning.', id: 'Dia (perempuan) minum kopi di pagi hari.', alt: ['She drinks coffee every morning.'] },
            { t: 'Can I have some water?', id: 'Boleh saya minta air?', alt: ['Can I have some water, please?', 'Could I have some water?'] },
            { t: 'The chicken is delicious.', id: 'Ayamnya enak.', alt: ['The chicken is tasty.'] },
          ] },
        { id: 'en5', title: 'Kegiatan',

function voiceFor(lang) {
  const base = lang.slice(0, 2);
  return voices.find(v => v.lang === lang) || voices.find(v => v.lang.replace('_', '-').startsWith(lang)) || voices.find(v => v.lang.startsWith(base));
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function listen(onText, onState) {
  if (!SR) return;
  try { if (rec) rec.abort(); } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
  rec = new SR();
  rec.lang = C().lang; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
  let got = false;
  rec.onstart = () => onState('listening');
  rec.onresult = e => { got = true; const r = e.results[0]; onText(Array.from(r).map(a => a.transcript)); };
  rec.onerror = e => { onState(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'denied' : e.error === 'no-speech' ? 'silent' : 'error'); };
  rec.onend = () => { if (!got) onState('idle'); };
  try { rec.start(); } catch (e) { onState('error'); }
}

/* =================== Pencocokan teks =================== */
const EN_NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];
const CONTR = { "i'm": 'i am', "you're": 'you are', "we're": 'we are', "they're": 'they are', "he's": 'he is', "she's": 'she is', "it's": 'it is', "that's": 'that is', "what's": 'what is', "i'll": 'i will', "you'll": 'you will', "we'll": 'we will', "can't": 'can not', 'cannot': 'can not', "don't": 'do not', "doesn't": 'does not', "isn't": 'is not', "aren't": 'are not', "i've": 'i have', "o'clock": 'oclock', "let's": 'let us' };
function normEnWord(w) {
  w = w.toLowerCase().replace(/[\u2019\u2018`]/g, "'").replace(/[^a-z0-9']/g, '');
  if (!w) return [];
  if (CONTR[w]) return CONTR[w].split(' ');
  if (/^\d+$/.test(w) && +w <= 20) return [EN_NUM[+w]];
  return [w.replace(/'/g, '')];
}
function enTokens(s) { return s.replace(/(\d+):00/g, '$1 oclock').split(/[\s,.!?;:]+/).flatMap(normEnWord).filter(Boolean); }
const ZH_D = '零一二三四五六七八九';
function zhNum(n) { n = +n; if (n < 10) return ZH_D[n]; if (n < 20) return '十' + (n % 10 ? ZH_D[n % 10] : ''); if (n < 100) return ZH_D[Math.floor(n / 10)] + '十' + (n % 10 ? ZH_D[n % 10] : ''); return String(n); }
function zhChars(s) {
  return s.replace(/\d+/g, m => zhNum(m)).replace(/两/g, '二').replace(/[她它]/g, '他')
    .replace(/[^\u4e00-\u9fff]/g, '').split('');
}
const tokensOf = s => isZh() ? zhChars(s) : enTokens(s);

/* LCS: berapa token target yang cocok, dan token mana saja */
function align(target, heard) {
  const n = target.length, m = heard.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = target[i] === heard[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ok = new Array(n).fill(false); let i = 0, j = 0;
  while (i < n && j < m) { if (target[i] === heard[j]) { ok[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  const hit = dp[0][0];
  return { ok, score: n + m ? (2 * hit) / (n + m) : 0 };
}
function sentText(s) { return s.t || s.tk.map(x => x[0]).join(''); }
function sentAccepted(s) { return [sentText(s)].concat(s.alt || []); }

/* Hasil pengucapan per kata (untuk pewarnaan) */
function judgeSpeech(sentence, alts) {
  let best = null;
  sentAccepted(sentence).forEach((ans, ai) => {
    const target = tokensOf(ans);
    alts.forEach(h => {
      const r = align(target, tokensOf(h));
      if (!best || r.score > best.score) best = Object.assign(r, { ans, ai, heard: h, target });
    });
  });
  return best;
}
/* Petakan token yang dinormalisasi ke kata/karakter aslinya */
function displayUnits(sentence, ans, okFlags) {
  const units = [];
  if (isZh() && ans === sentText(sentence)) {
    sentence.tk.forEach(([h, p]) => { const ch = zhChars(h); if (ch.length) units.push({ text: h, py: p, n: ch.length }); });
  } else if (isZh()) {
    ans.split('').forEach(ch => { const n = zhChars(ch).length; if (n) units.push({ text: ch, n }); });
  } else {
    ans.split(/\s+/).forEach(w => { const n = enTokens(w).length; if (n) units.push({ text: w, n }); });
  }
  let k = 0;
  return units.map(u => { const good = okFlags.slice(k, k + u.n).every(Boolean); k += u.n; return Object.assign(u, { good }); });
}

/* =================== Membuat soal =================== */
function buildLesson(lesson) {
  const W = lesson.words, SS = lesson.sentences, zh = isZh();
  const ex = [];
  pick(W, 3).forEach(w => ex.push({ type: 'mc', word: w, opts: shuffle([w[1]].concat(pick(W.filter(x => x !== w).map(x => x[1]), 3))) }));
  ex.push({ type: 'match', pairs: pick(W, Math.min(5, W.length)) });
  const s4 = shuffle(SS);
  ex.push({ type: 'build', s: s4[0] });
  ex.push({ type: 'build', s: s4[1] });
  ex.push({ type: 'listen', s: s4[2] });
  ex.push({ type: 'speak', s: s4[3] });
  ex.push({ type: 'speak', s: s4[0] });
  ex.push({ type: 'speaktr', s: s4[1] });
  ex.push({ type: 'mcrev', word: pick(W, 1)[0] });
  const last = ex.pop();
  const order = [ex[0], ex[4], ex[1], ex[7], ex[3], ex[5], ex[2], ex[6], ex[8], last].filter(Boolean);
  const speakOff = !canListen || S.speakOffUntil > Date.now();
  return order.filter(e => !(speakOff && (e.type === 'speak' || e.type === 'speaktr'))).map(e => {
    if (e.type === 'mcrev') { const w = e.word; e.opts = shuffle([w].concat(pick(W.filter(x => x !== w), 3))); }
    if (e.type === 'build' || e.type === 'listen') e.bank = bankFor(e.s, lesson);
    return e;
  });
}
function sentTiles(s) {
  if (s.tk) return s.tk.filter(t => /[\u4e00-\u9fff]/.test(t[0])).map(t => ({ t: t[0], p: t[1] }));
  return s.t.replace(/[.,!?]/g, '').split(/\s+/).map(t => ({ t }));
}
function bankFor(s, lesson) {
  const tiles = sentTiles(s);
  const have = new Set(tiles.map(t => t.t.toLowerCase()));
  let pool;
  if (s.tk) pool = lesson.sentences.flatMap(x => sentTiles(x)).concat(lesson.words.map(w => ({ t: w[0], p: w[2] })));
  else pool = lesson.words.filter(w => !w[0].includes(' ')).map(w => ({ t: w[0] })).concat(lesson.sentences.flatMap(x => sentTiles(x)));
  const seen = new Set();
  const extra = shuffle(pool).filter(t => { const k = t.t.toLowerCase(); if (have.has(k) || seen.has(k)) return false; seen.add(k); return true; }).slice(0, 3);
  return shuffle(tiles.concat(extra)).map((t, i) => Object.assign({ i }, t));
}

function coloredSentence(s, r) {

function canCheck(e) {

function check() {

/* =================== Efek suara kecil =================== */
let actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function tone(f, t, d, type = 'sine', g0 = .18) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(g0, actx.currentTime + t + .015);
  g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + t + d);
  o.connect(g).connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + d + .02);
}
function sound(kind) {
  if (!actx) return;
  try {
    if (kind === true) { tone(660, 0, .12); tone(990, .1, .2); }
    else if (kind === 'win') { [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .11, .25, 'triangle')); }
    else { tone(220, 0, .22, 'square', .07); }
  } catch (e) {}
}

function modalNoHearts() {
  refillHearts();
  const mins = Math.ceil((HEART_MS - (Date.now() - S.heartAt)) / 60000);
  modal(`${mascot('sad')}<h3>Hati kamu habis</h3><p>1 hati terisi lagi dalam ${mins} menit. Sambil menunggu, ulangi pelajaran yang sudah selesai untuk dapat 1 hati.</p><button class="btn" data-act="close-modal">Oke</button>`);
}
let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }

/* =================== Event =================== */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  unlockAudio();
  switch (a) {
    case 'tab': nav.tab = b.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'pick-course': S.course = b.dataset.c; save(); nav.tab = 'learn'; nav.scrollToCurrent = true; render(); window.scrollTo(0, 0); break;
    case 'theme': S.theme = b.dataset.v; save(); applyTheme(); render(); break;
    case 'rate': S.rate = +b.dataset.v; save(); render(); say(isZh() ? '你好' : 'Hello'); break;
    case 'speak-on': S.speakOffUntil = 0; save(); render(); toast('Latihan bicara aktif lagi'); break;
    case 'reset':
      if (!confirm(`Hapus semua progres ${C().short}? XP dan hari beruntun tetap.`)) return;
      allLessons(S.course).forEach(l => delete S.done[l.id]); save(); render(); break;
    case 'locked': toast('Selesaikan pelajaran sebelumnya dulu'); break;
    case 'start': startLesson(b.dataset.id); break;
    case 'quit':
      if (L.answered > 0 && !confirm('Keluar sekarang? Progres pelajaran ini akan hilang.')) return;
      stopListen(); L = null; render(); break;
    case 'say': say(b.dataset.t); break;
    case 'say-slow': say(b.dataset.t, true); break;
    case 'sel': if (L.state !== 'answer') return; L.sel = b.dataset.v; render();
      { const e = cur(); if (e.type === 'mcrev') say(L.sel); } break;
    case 'pick': if (L.state !== 'answer') return; L.picked.push(+b.dataset.i); { const t = cur().bank[+b.dataset.i]; if (isZh()) say(t.t); } render(); break;
    case 'unpick': if (L.state !== 'answer') return; L.picked = L.picked.filter(i => i !== +b.dataset.i); render(); break;
    case 'pair': {
      const e = cur(), side = b.dataset.side, k = b.dataset.k;
      L.sel = Object.assign({}, L.sel, { wrong: null, [side]: k });
      if (side === 'L') say(k);
      if (L.sel.L && L.sel.R) {
        if (L.sel.L === L.sel.R) { L.matched.push(k); L.sel = null; sound(true); }
        else { const w = side + k; L.sel = { wrong: w }; sound(false); }
      }
      render();
      if (L.matched.length === e.pairs.length) { L.state = 'right'; L.feedback = { title: 'Semua cocok!' }; render(); }
      break;
    }
    case 'mic': {
      if (L.micState === 'listening') { stopListen(); return; }
      const e = cur();
      listen(alts => {
        L.result = judgeSpeech(e.s, alts); L.micState = null; render();
      }, st => { L.micState = st === 'idle' ? (L.micState === 'listening' ? 'silent' : null) : st; if (L && !L.finished) render(); });
      break;
    }
    case 'skip-speak':
      S.speakOffUntil = Date.now() + 15 * 60 * 1000; save(); stopListen();
      L.queue = L.queue.filter((e, i) => i <= L.i || (e.type !== 'speak' && e.type !== 'speaktr'));
      L.state = 'right'; L.feedback = { title: 'Oke, latihan bicara dilewati', html: 'Latihan bicara dimatikan 15 menit.' };
      render(); break;
    case 'retry-speak': L.state = 'answer'; L.result = null; L.micState = null; L.feedback = null; render(); break;
    case 'check': check(); break;
    case 'next': next(); break;
    case 'done': L = null; nav.scrollToCurrent = true; render(); break;
    case 'close-modal': closeModal(); break;
  }
});
/* Pilih jawaban dengan angka 1-4 di keyboard, Enter untuk periksa/lanjut */
document.addEventListener('keydown', ev => {
  if (!L || L.finished) return;
  if (/^[1-4]$/.test(ev.key) && L.state === 'answer') { const o = document.querySelectorAll('.opt')[+ev.key - 1]; if (o) o.click(); }
  if (ev.key === 'Enter') { const btn = document.querySelector('[data-act="check"]:not([disabled]), .checkbar [data-act="next"]'); if (btn) btn.click(); }
});

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});

</script>
